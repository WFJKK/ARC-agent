# Withheld from the agent: no tool reaches this folder, and the strings under hygiene are what the hygiene check
# looks for in everything the agent can reach (prompt, tool descriptions, sandbox files, names).
# The agent is told the task and the data set (models/rnn-e/config.yaml, task.py). What is withheld is how
# often each network gives the task's answer, which network is which, and where the networks come from:
# here, how they were made and which inputs they were trained on, if any.
networks: >
  Untrained: the states AlgZoo's trainer starts from for rnn-b's five seeds (hidden size 4, three numbers), saved
  before its first step. A baseline for rnn-b.
provenance: >
  Mech-Interp-Agent-level1 (github.com/WFJKK/Mech-Interp-Agent-level1, commit bee70fb), models/rnn-e, the same
  files byte for byte (the sha256 in models/rnn-e/config.yaml); its withheld/rnn-e/task.yaml has the whole record.
  They are converted by withheld/rnn/convert.py from 2nd_argmax_4_3_0_<seed>.pth (0 training inputs).
# The verifier's own measurement (arcagent/networks.py, Model.accuracy): 2,097,152 inputs drawn with
# seed 20261124, 32,768 at a time, run through the interpreter. Standard error at most 0.034 points.
accuracy:
  rnn-e-s0: 0.381069   # 799159 of 2097152
  rnn-e-s4: 0.379541   # 795955 of 2097152
  rnn-e-s1: 0.393212   # 824626 of 2097152
  rnn-e-s2: 0.324655   # 680851 of 2097152
  rnn-e-s3: 0.416838   # 874173 of 2097152
roles: rnn-e-s0 for the rounds (config/pilot/rnn-e.yaml); the others held out
hygiene:
  - AlgZoo
  - alg-zoo
  - alg_zoo
  - alignment.org
  - Alignment Research
