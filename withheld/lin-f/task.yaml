# Withheld from the agent: no tool reaches this folder, and the strings under hygiene are what the hygiene check
# looks for in everything the agent can reach (prompt, tool descriptions, sandbox files, names).
# The agent is told the task and the data set (models/lin-f/config.yaml, task.py). What is withheld is how
# often each network gives the task's answer, which network is which, and where the networks come from:
# here, how they were made and which inputs they were trained on, if any.
networks: >
  Untrained: each network is the state lin-d's trainer starts from (seeds 2000 to 2005), drawn and kept as drawn.
  A baseline for lin-d (and lin-b, of the same design and data set). The task is lin-d's.
provenance: >
  Mech-Interp-Agent-level1 (github.com/WFJKK/Mech-Interp-Agent-level1, commit bee70fb), models/lin-f, the same
  files byte for byte (the sha256 in models/lin-f/config.yaml); its withheld/lin-f/task.yaml has the whole record.
  They were drawn by level 1's withheld/lin-f/draw.py.
# The verifier's own measurement (arcagent/networks.py, Model.accuracy): 2,097,152 inputs drawn with
# seed 20261124, 32,768 at a time, run through the interpreter. Standard error at most 0.011 points.
accuracy:
  lin-f-s0: 0.011285   # 23667 of 2097152
  lin-f-s1: 0.027068   # 56766 of 2097152
  lin-f-s2: 0.009017   # 18910 of 2097152
  lin-f-s3: 0.007024   # 14730 of 2097152
  lin-f-s4: 0.015992   # 33537 of 2097152
  lin-f-s5: 0.004424   # 9278 of 2097152
roles: lin-f-s0 for the rounds (config/pilot/lin-f.yaml); the others held out
hygiene:
  - untrained
  - not trained
  - never trained
  - before training
  - random weights
  - randomly initialized
  - randomly initialised
  - random init
  - initialization
  - initialisation
  - baseline
  - trained on
  - Gross
  - compact proof
  - compact-proof
