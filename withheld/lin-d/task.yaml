# Withheld from the agent: no tool reaches this folder, and the strings under hygiene are what the hygiene check
# looks for in everything the agent can reach (prompt, tool descriptions, sandbox files, names).
# The agent is told the task and the data set (models/lin-d/config.yaml, task.py). What is withheld is how
# often each network gives the task's answer, which network is which, and where the networks come from:
# here, how they were made and which inputs they were trained on, if any.
networks: >
  Two linear networks of width 8 trained on exactly four tokens for the smallest, asked about one to eight tokens:
  lin-b's counterpart for the other task.
provenance: >
  Mech-Interp-Agent-level1 (github.com/WFJKK/Mech-Interp-Agent-level1, commit bee70fb), models/lin-d, the same
  files byte for byte (the sha256 in models/lin-d/config.yaml); its withheld/lin-d/task.yaml has the whole record.
  They were trained by level 1's withheld/lin-d/train.py (lin-b's trainer with the smallest token as the label;
  seeds 0 and 1; 50,000 and 70,000 steps).
# The verifier's own measurement (arcagent/networks.py, Model.accuracy): 2,097,152 inputs drawn with
# seed 20261124, 32,768 at a time, run through the interpreter. Standard error at most 0.016 points.
accuracy:
  lin-d-s0: 0.945307   # 1982453 of 2097152
  lin-d-s1: 0.951984   # 1996455 of 2097152
roles: lin-d-s0 for the rounds (config/pilot/lin-d.yaml); the others held out
hygiene:
  - Gross
  - compact proof
  - compact-proof
  - attn-max
  - attn-min
  - max2
  - max4
  - min2
  - min4
  - trained on
  - four tokens
  - "4 tokens"
  - exactly four
  - "0.9453"
  - "94.53%"
  - "0.945"
  - "94.5%"
  - "0.9520"
  - "95.20%"
  - "0.952"
  - "95.2%"
