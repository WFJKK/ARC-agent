# Withheld from the agent: no tool reaches this folder, and the strings under hygiene are what the hygiene check
# looks for in everything the agent can reach (prompt, tool descriptions, sandbox files, names).
# The agent is told the task and the data set (models/att-b/config.yaml, task.py). What is withheld is how
# often each network gives the task's answer, which network is which, and where the networks come from:
# here, how they were made and which inputs they were trained on, if any.
networks: >
  Gross et al.'s one-layer, one-head, attention-only transformer, as att-a's, trained on exactly two tokens for
  the smaller (Compact-Proof-Agent, models/attn-min2, setting v64, seeds 0 and 1), asked about one or two tokens.
  Both networks are right on every input of the data set.
provenance: >
  Mech-Interp-Agent-level1 (github.com/WFJKK/Mech-Interp-Agent-level1, commit bee70fb), models/att-b, the same
  files byte for byte (the sha256 in models/att-b/config.yaml); its withheld/att-b/task.yaml has the whole record.
  They are the proof pipeline's networks, renamed as att-a's and with embed given an all-zero row for the empty
  slot.
# The verifier's own measurement (arcagent/networks.py, Model.accuracy): exact, every one of the
# data set's 4,160 inputs, each weighted by how often it is drawn.
accuracy:
  att-b-s0: 1.000000   # 4160 of 4160 inputs right
  att-b-s1: 1.000000   # 4160 of 4160 inputs right
roles: att-b-s0 for the rounds (config/pilot/att-b.yaml); the others held out
hygiene:
  - Gross
  - compact proof
  - compact-proof
  - attn-max
  - attn-min
  - max2
  - max4
  - min2
  - min4
  - trained on
  - two tokens
  - "2 tokens"
  - exactly two
  - pairs
  - "1.0000"
  - "100.00%"
