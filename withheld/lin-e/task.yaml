# Withheld from the agent: no tool reaches this folder, and the strings under hygiene are what the hygiene check
# looks for in everything the agent can reach (prompt, tool descriptions, sandbox files, names).
# The agent is told the task and the data set (models/lin-e/config.yaml, task.py). What is withheld is how
# often each network gives the task's answer, which network is which, and where the networks come from:
# here, how they were made and which inputs they were trained on, if any.
networks: >
  Untrained: each network is the state lin-c's trainer starts from (seeds 1000 to 1005), drawn and kept as drawn,
  with an all-zero column for the empty slot. A baseline for lin-c (and lin-a-1to4, of the same design and data
  set): nothing learned to find, so what a run achieves here is generic. The task is lin-c's.
provenance: >
  Mech-Interp-Agent-level1 (github.com/WFJKK/Mech-Interp-Agent-level1, commit bee70fb), models/lin-e, the same
  files byte for byte (the sha256 in models/lin-e/config.yaml); its withheld/lin-e/task.yaml has the whole record.
  They were drawn by level 1's withheld/lin-e/draw.py.
# The verifier's own measurement (arcagent/networks.py, Model.accuracy): 2,097,152 inputs drawn with
# seed 20261124, 32,768 at a time, run through the interpreter. Standard error at most 0.012 points.
accuracy:
  lin-e-s0: 0.007371   # 15458 of 2097152
  lin-e-s1: 0.016299   # 34181 of 2097152
  lin-e-s2: 0.023742   # 49790 of 2097152
  lin-e-s3: 0.028812   # 60423 of 2097152
  lin-e-s4: 0.011214   # 23517 of 2097152
  lin-e-s5: 0.005531   # 11599 of 2097152
roles: lin-e-s0 for the rounds (config/pilot/lin-e.yaml); the others held out
hygiene:
  - untrained
  - not trained
  - never trained
  - before training
  - random weights
  - randomly initialized
  - randomly initialised
  - random init
  - initialization
  - initialisation
  - baseline
  - trained on
  - Gross
  - compact proof
  - compact-proof
