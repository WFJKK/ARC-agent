# Withheld from the agent: no tool reaches this folder, and the strings under hygiene are what the hygiene check
# looks for in everything the agent can reach (prompt, tool descriptions, sandbox files, names).
# The agent is told the task and the data set (models/lin-b-4/config.yaml, task.py). What is withheld is how
# often each network gives the task's answer, which network is which, and where the networks come from:
# here, how they were made and which inputs they were trained on, if any.
networks: >
  lin-b's networks byte for byte, asked about exactly four tokens: the inputs they were trained on.
provenance: >
  Mech-Interp-Agent-level1 (github.com/WFJKK/Mech-Interp-Agent-level1, commit bee70fb), models/lin-b-4, the same
  files byte for byte (the sha256 in models/lin-b-4/config.yaml); its withheld/lin-b-4/task.yaml has the whole
  record. They are models/lin-b's networks, the same files; the network has no positions, so four tokens in four
  slots give the same output as in the first four of eight.
# The verifier's own measurement (arcagent/networks.py, Model.accuracy): 2,097,152 inputs drawn with
# seed 20261124, 32,768 at a time, run through the interpreter. Standard error at most 0.003 points.
accuracy:
  lin-b-4-s0: 0.998341   # 2093673 of 2097152
  lin-b-4-s1: 0.997855   # 2092654 of 2097152
roles: lin-b-4-s0 for the rounds (config/pilot/lin-b-4.yaml); the others held out
hygiene:
  - Gross
  - compact proof
  - compact-proof
  - attn-max
  - attn-min
  - max2
  - max4
  - min2
  - min4
  - trained on
  - "0.9983"
  - "99.83%"
  - "0.998"
  - "99.8%"
  - "0.9979"
  - "99.79%"
