# Withheld from the agent: no tool reaches this folder, and the strings under hygiene are what the hygiene check
# looks for in everything the agent can reach (prompt, tool descriptions, sandbox files, names).
# The agent is told the task and the data set (models/att-c/config.yaml, task.py). What is withheld is how
# often each network gives the task's answer, which network is which, and where the networks come from:
# here, how they were made and which inputs they were trained on, if any.
networks: >
  Gross et al.'s one-layer, one-head, attention-only transformer, as att-a's, trained on exactly four tokens for
  the largest (Compact-Proof-Agent, models/attn-max4, setting v64, seeds 0 and 1), asked about one to four tokens.
  On four tokens both are right almost always; on fewer they differ a lot (s0 is right on about 17% of three-token
  inputs, s1 on 98%).
provenance: >
  Mech-Interp-Agent-level1 (github.com/WFJKK/Mech-Interp-Agent-level1, commit bee70fb), models/att-c, the same
  files byte for byte (the sha256 in models/att-c/config.yaml); its withheld/att-c/task.yaml has the whole record.
  They are the proof pipeline's networks, renamed as att-a's and with embed given an all-zero row for the empty
  slot.
# The verifier's own measurement (arcagent/networks.py, Model.accuracy): 2,097,152 inputs drawn with
# seed 20261124, 16,384 at a time, run through the interpreter. Standard error at most 0.029 points.
accuracy:
  att-c-s0: 0.765185   # 1604709 of 2097152
  att-c-s1: 0.913758   # 1916289 of 2097152
roles: att-c-s0 for the rounds (config/pilot/att-c.yaml); the others held out
hygiene:
  - Gross
  - compact proof
  - compact-proof
  - attn-max
  - attn-min
  - max2
  - max4
  - min2
  - min4
  - trained on
  - four tokens
  - "4 tokens"
  - exactly four
  - "0.7652"
  - "76.52%"
  - "0.765"
  - "76.5%"
  - "0.9138"
  - "91.38%"
  - "0.914"
  - "91.4%"
