# Withheld from the agent: no tool reaches this folder, and the strings under hygiene are what the hygiene check
# looks for in everything the agent can reach (prompt, tool descriptions, sandbox files, names).
# The agent is told the task and the data set (models/rnn-d/config.yaml, task.py). What is withheld is how
# often each network gives the task's answer, which network is which, and where the networks come from:
# here, how they were made and which inputs they were trained on, if any.
networks: >
  Untrained: the states AlgZoo's trainer starts from for rnn-a's five seeds, saved before its first step. A
  baseline for rnn-a. s0 and s4 answer 0 on every input, as rnn-a's s0 and s4 still do after training.
provenance: >
  Mech-Interp-Agent-level1 (github.com/WFJKK/Mech-Interp-Agent-level1, commit bee70fb), models/rnn-d, the same
  files byte for byte (the sha256 in models/rnn-d/config.yaml); its withheld/rnn-d/task.yaml has the whole record.
  They are converted by withheld/rnn/convert.py from 2nd_argmax_2_2_0_<seed>.pth (0 training inputs).
# The verifier's own measurement (arcagent/networks.py, Model.accuracy): 2,097,152 inputs drawn with
# seed 20261124, 32,768 at a time, run through the interpreter. Standard error at most 0.035 points.
accuracy:
  rnn-d-s2: 0.276295   # 579433 of 2097152
  rnn-d-s1: 0.251639   # 527726 of 2097152
  rnn-d-s0: 0.499569   # 1047673 of 2097152
  rnn-d-s3: 0.478619   # 1003737 of 2097152
  rnn-d-s4: 0.499569   # 1047673 of 2097152
roles: rnn-d-s2 for the rounds (config/pilot/rnn-d.yaml); the others held out
hygiene:
  - AlgZoo
  - alg-zoo
  - alg_zoo
  - alignment.org
  - Alignment Research
