# Withheld from the agent: no tool reaches this folder, and the strings under hygiene are what the hygiene check
# looks for in everything the agent can reach (prompt, tool descriptions, sandbox files, names).
# The agent is told the task and the data set (models/lin-b/config.yaml, task.py). What is withheld is how
# often each network gives the task's answer, which network is which, and where the networks come from:
# here, how they were made and which inputs they were trained on, if any.
networks: >
  Two linear networks of width 8 trained on exactly four tokens for the largest, asked about one to eight tokens.
  Inputs of other lengths are outside what they were trained on, and the networks are right on them less often the
  further their length is from four.
provenance: >
  Mech-Interp-Agent-level1 (github.com/WFJKK/Mech-Interp-Agent-level1, commit bee70fb), models/lin-b, the same
  files byte for byte (the sha256 in models/lin-b/config.yaml); its withheld/lin-b/task.yaml has the whole record.
  They were trained by level 1's withheld/lin-b/train.py (the proof pipeline's linear network and recipe, written
  in numpy; seeds 0 and 1; 80,000 and 70,000 steps, until the share of four-token inputs answered right stopped
  growing).
# The verifier's own measurement (arcagent/networks.py, Model.accuracy): 2,097,152 inputs drawn with
# seed 20261124, 32,768 at a time, run through the interpreter. Standard error at most 0.016 points.
accuracy:
  lin-b-s0: 0.944895   # 1981588 of 2097152
  lin-b-s1: 0.944820   # 1981432 of 2097152
roles: lin-b-s0 for the rounds (config/pilot/lin-b.yaml); the others held out
hygiene:
  - Gross
  - compact proof
  - compact-proof
  - attn-max
  - attn-min
  - max2
  - max4
  - min2
  - min4
  - trained on
  - four tokens
  - "4 tokens"
  - exactly four
  - "0.9449"
  - "94.49%"
  - "0.945"
  - "94.5%"
  - "0.9448"
  - "94.48%"
