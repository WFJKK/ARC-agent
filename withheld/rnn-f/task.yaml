# Withheld from the agent: no tool reaches this folder, and the strings under hygiene are what the hygiene check
# looks for in everything the agent can reach (prompt, tool descriptions, sandbox files, names).
# The agent is told the task and the data set (models/rnn-f/config.yaml, task.py). What is withheld is how
# often each network gives the task's answer, which network is which, and where the networks come from:
# here, how they were made and which inputs they were trained on, if any.
networks: >
  Untrained: the states AlgZoo's trainer starts from for the zoo's five networks of rnn-g's design (hidden size
  16, ten numbers: rnn-g-z0 to z4, level 1's rnn-c), saved before its first step. A baseline for them.
provenance: >
  Mech-Interp-Agent-level1 (github.com/WFJKK/Mech-Interp-Agent-level1, commit bee70fb), models/rnn-f, the same
  files byte for byte (the sha256 in models/rnn-f/config.yaml); its withheld/rnn-f/task.yaml has the whole record.
  They are converted by withheld/rnn/convert.py from 2nd_argmax_16_10_0_<seed>.pth (0 training inputs).
# The verifier's own measurement (arcagent/networks.py, Model.accuracy): 2,097,152 inputs drawn with
# seed 20261124, 32,768 at a time, run through the interpreter. Standard error at most 0.023 points.
accuracy:
  rnn-f-s2: 0.133579   # 280135 of 2097152
  rnn-f-s3: 0.121192   # 254158 of 2097152
  rnn-f-s0: 0.090883   # 190596 of 2097152
  rnn-f-s1: 0.122217   # 256308 of 2097152
  rnn-f-s4: 0.100842   # 211480 of 2097152
roles: rnn-f-s2 for the rounds (config/pilot/rnn-f.yaml); the others held out
hygiene:
