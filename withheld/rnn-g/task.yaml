# Withheld from the agent: no tool reaches this folder, and the strings under hygiene are what the hygiene check
# looks for in everything the agent can reach (prompt, tool descriptions, sandbox files, names).
# The agent is told the task (models/rnn-g/config.yaml, task.says, and task.py): an accuracy means nothing
# without it. What is withheld is how often each network gives the task's answer, which network is which, and
# the names that lead to the published figures.
networks: >
  rnn-g-s0 is the 432-weight network ARC's AlgZoo write-up analyses and sets as its challenge: to design a method
  that estimates this network's accuracy mechanistically, at least as well as random sampling does for the same
  compute. The write-up puts it at 95.3%, reads five of its sixteen units (1, 2, 4, 6 and 7, the ones with sparse
  weights) as leave-one-out maxima, and leaves most of the other eleven unexplained. It is not one of the zoo's
  own networks; it is published next to them, without its training recipe. rnn-g-z0 to rnn-g-z4 are the zoo's
  five networks of the same design and sizes (2nd argmax, hidden size 16, ten numbers), seeds 0 to 4 of one
  recipe; z2 is the zoo's own pick. rnn-g-n1 to rnn-g-n3 are rnn-g-s0 with noise added to every weight
  (withheld/rnn-g/noise.py): 0.2%, 0.5% and 1% of each matrix's root mean square.
provenance:
  source: ARC's AlgZoo, github.com/alignment-research-center/alg-zoo (commit 4433f50, licence MIT-0), and its
    write-up, alignment.org/blog/algzoo-uninterpreted-models-with-fewer-than-1-500-parameters
  files:
    rnn-g-s0: withheld/rnn/pth/one_layer_16_hidden_94_acc_2nd_argmax.pth, from gs://arc-ml-public/alg (not its zoo
      folder; alg_zoo/loading.py, example_2nd_argmax), fetched on 17 November 2026
    rnn-g-z<seed>: withheld/rnn/pth/2nd_argmax_16_10_1073741824_<seed>.pth, from gs://arc-ml-public/alg/zoo,
      fetched on 12 November 2026
    rnn-g-n<k>: made by withheld/rnn-g/noise.py from rnn-g-s0
  converted_by: withheld/rnn/convert.py (input = rnn.weight_ih_l0, recurrent = rnn.weight_hh_l0, readout = linear.weight;
    float32 as published; read without torch, by an unpickler that runs nothing). The same files as
    Mech-Interp-Agent-level1's rnn-g-s0 and rnn-c-s0 to s4, byte for byte.
  recipe: z0 to z4, alg_zoo/training.py, train("2nd_argmax", hidden_size=16, seq_len=10, seed=seed); every step 1,024
    inputs of th.randn, labelled x.argsort(-1)[..., -2]; cross-entropy; AdamW, lr 0.04 / sqrt(16), weight decay 0.001,
    warmed up over 2^14 steps and then decayed exponentially to 0.01 of it; 2^30 inputs in all. s0's is not published.
# The verifier's own measurement (arcagent/networks.py, Model.accuracy): 2,097,152 inputs drawn with seed 20261124,
# 32,768 at a time, run through the interpreter. Standard error about 0.015 to 0.03 percentage points.
accuracy:
  rnn-g-s0: 0.953078   # 1998749 of 2097152
  rnn-g-z0: 0.909862   # 1908119
  rnn-g-z1: 0.880417   # 1846368
  rnn-g-z2: 0.948575   # 1989305
  rnn-g-z3: 0.931835   # 1954200
  rnn-g-z4: 0.889638   # 1865706
  rnn-g-n1: 0.944583   # 1980934
  rnn-g-n2: 0.845580   # 1773309
  rnn-g-n3: 0.693744   # 1454887
roles: s0 for the rounds; z0 to z4 and n1 to n3 held out, for the report's check of the locked estimator
