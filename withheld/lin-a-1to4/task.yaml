# Withheld from the agent: no tool reaches this folder, and the strings under hygiene are what the hygiene check
# looks for in everything the agent can reach (prompt, tool descriptions, sandbox files, names).
# The agent is told the task and the data set (models/lin-a-1to4/config.yaml, task.py). What is withheld is how
# often each network gives the task's answer, which network is which, and where the networks come from:
# here, how they were made and which inputs they were trained on, if any.
networks: >
  lin-a's two networks (lin-a-1to4-s0 is lin-a-s0 and s1 is s1), with one all-zero embedding column added for the
  empty slot, asked about one to four tokens. They were trained on exactly two tokens and on nothing else; they
  are right on almost every input of one or two tokens and far less often on three or four.
provenance: >
  Mech-Interp-Agent-level1 (github.com/WFJKK/Mech-Interp-Agent-level1, commit bee70fb), models/lin-a-1to4, the
  same files byte for byte (the sha256 in models/lin-a-1to4/config.yaml); its withheld/lin-a-1to4/task.yaml has
  the whole record. They are models/lin-a's networks with one all-zero column added to embed; hidden and unembed
  are unchanged.
# The verifier's own measurement (arcagent/networks.py, Model.accuracy): 2,097,152 inputs drawn with
# seed 20261124, 32,768 at a time, run through the interpreter. Standard error at most 0.026 points.
accuracy:
  lin-a-1to4-s0: 0.842362   # 1766561 of 2097152
  lin-a-1to4-s1: 0.823785   # 1727603 of 2097152
roles: lin-a-1to4-s0 for the rounds (config/pilot/lin-a-1to4.yaml); the others held out
hygiene:
  - Gross
  - compact proof
  - compact-proof
  - attn-max
  - attn-min
  - max2
  - max4
  - min2
  - min4
  - trained on
  - two tokens
  - "2 tokens"
  - exactly two
  - pairs
  - "0.8424"
  - "84.24%"
  - "0.842"
  - "84.2%"
  - "0.8238"
  - "82.38%"
  - "0.824"
  - "82.4%"
