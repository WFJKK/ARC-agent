# A first contact with the att-d pilot, kept small on purpose: one round with a short session, one held-out
# network and fewer runs there, to see that everything works together before the pilot proper
# (config/pilot/att-d.yaml).
extends: att-d.yaml
run_id: pilot-att-d-smoke
rounds_max: 1
session:
  python_calls: 8
  submissions: 2
  max_turns: 40
  seconds: 1200
heldout:
  networks: [att-d-s1]
  runs: 64
  check_runs: 512
