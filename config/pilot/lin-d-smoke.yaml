# A first contact with the lin-d pilot, kept small on purpose: one round with a short session, one held-out
# network and fewer runs there, to see that everything works together before the pilot proper
# (config/pilot/lin-d.yaml).
extends: lin-d.yaml
run_id: pilot-lin-d-smoke
rounds_max: 1
session:
  python_calls: 8
  submissions: 2
  max_turns: 40
  seconds: 1200
heldout:
  networks: [lin-d-s1]
  runs: 64
  check_runs: 512
