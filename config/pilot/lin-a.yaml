# The pilot on lin-a-s0: a linear network on two tokens (models/lin-a). Its held-out networks are the model's others.
# Everything else is config/pilot/base.yaml and config/defaults.yaml.
extends: base.yaml
run_id: pilot-lin-a
model: models/lin-a
network: lin-a-s0
heldout:
  networks: [lin-a-s1]
verifier:
  copies: {share: 0.01, size: 1.19}   # how this network's copies are made (python -m arcagent.calibrate)
