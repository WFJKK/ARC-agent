# A first contact with the lin-f-4 pilot, kept small on purpose: one round with a short session, one held-out
# network and fewer runs there, to see that everything works together before the pilot proper
# (config/pilot/lin-f-4.yaml).
extends: lin-f-4.yaml
run_id: pilot-lin-f-4-smoke
rounds_max: 1
session:
  python_calls: 8
  submissions: 2
  max_turns: 40
  seconds: 1200
heldout:
  networks: [lin-f-4-s1]
  runs: 64
  check_runs: 512
