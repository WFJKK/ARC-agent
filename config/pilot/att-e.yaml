# The pilot on att-e-s0: a one-layer, one-head attention network on one to four tokens (models/att-e). Its held-out networks are the model's others.
# Everything else is config/pilot/base.yaml and config/defaults.yaml.
extends: base.yaml
run_id: pilot-att-e
model: models/att-e
network: att-e-s0
heldout:
  networks: [att-e-s1, att-e-s2, att-e-s3, att-e-s4, att-e-s5]
