# A first contact with the rnn-e pilot, kept small on purpose: one round with a short session, one held-out
# network and fewer runs there, to see that everything works together before the pilot proper
# (config/pilot/rnn-e.yaml).
extends: rnn-e.yaml
run_id: pilot-rnn-e-smoke
rounds_max: 1
session:
  python_calls: 8
  submissions: 2
  max_turns: 40
  seconds: 1200
heldout:
  networks: [rnn-e-s4]
  runs: 64
  check_runs: 512
