# Defaults of every run. A run config names a model and its network and overrides what it needs.
# Numbers live here and in the run configs, never in code.

runs_dir: ~/arc-agent-runs            # run folders live outside the repository
run_id: null                          # a run config sets it; the run folder is <runs_dir>/<run_id>

# who answers a round (docs/DESIGN.md, section 6; docs/OPENAI.md for the two OpenAI backends)
backend: claude_code                  # claude_code: the Claude Code CLI; codex: OpenAI's Codex CLI, under a ChatGPT
                                      # login; openai_api: OpenAI's API, billed to a key; fake: scripted
auth: login                           # who pays: login, the CLI's own login (a subscription is not billed per
                                      # call); api_key, the key in api_key_env, billed per token, within budget.
                                      # codex takes login only and openai_api takes api_key only
api_key_env: CPL_ANTHROPIC_KEY        # never ANTHROPIC_API_KEY: the backend removes that from the CLI's environment.
                                      # An openai_api run names its own (CPL_OPENAI_KEY), never OPENAI_API_KEY
api_workspace_env: CPL_ANTHROPIC_WORKSPACE  # a workspace ID (wrkspc_...), for a key not scoped to one; unset: none sent
budget:                               # api_key: dollars, by Claude Code's own count, or for openai_api by the
                                      # tokens the API reports at openai.prices (arcagent/budget.py)
  run_usd: 60                         # the rounds end when the run has spent this; resume --budget-usd changes it
  round_usd: 20                       # a round ends when it has spent this; what it submitted stands
agent_model: claude-fable-5-1         # the model of Mech-Interp-Agent-level1's pilots, for comparison
effort: high                          # low, medium, high, xhigh, max; null leaves it to the CLI
claude_code_command: claude
codex_command: codex                  # backend codex: the Codex CLI
codex_home: null                      # backend codex: the CLI's home folder (its login); null: the CLI's own
                                      # (~/.codex or CODEX_HOME). A home with an AGENTS.md is refused: name another
# backend openai_api (arcagent/backends/openai_api.py). The budget is counted from the tokens the API reports, at
# the prices here: dollars per million tokens, standard tier, from OpenAI's pricing page as read on 25 November 2026
# (developers.openai.com/api/docs/pricing). Check them against that page before a run: a wrong price makes the
# run's count, and so its budget, wrong. cached_input is for input tokens read from the prompt cache; cache_write
# for those written to it (input_tokens_details.cache_write_tokens), which GPT-5.6 and later bill at 1.25 times the
# input price for the default 30-minute cache (billed as input where a model has none). A request with more input
# tokens than long_context's above_input_tokens is billed at long_context's prices throughout.
openai:
  base_url: https://api.openai.com/v1
  request: {}                         # more fields of every request, as the API names them (context_management,
                                      # service_tier, max_output_tokens, ...); none by default
  idle_seconds: 900                   # a response that sends nothing for this long is taken as lost, and asked again
  prices:
    gpt-6.2-astra:
      {input: 8.00, cached_input: 0.40, cache_write: 10.00, output: 40.00,
       long_context: {above_input_tokens: 272000, input: 16.00, cached_input: 0.80, cache_write: 20.00, output: 60.00}}
    gpt-6.2-sol:
      {input: 2.00, cached_input: 0.10, cache_write: 2.50, output: 10.00,
       long_context: {above_input_tokens: 272000, input: 4.00, cached_input: 0.20, cache_write: 5.00, output: 15.00}}
    gpt-6.1-terra:
      {input: 1.00, cached_input: 0.05, cache_write: 1.25, output: 5.00,
       long_context: {above_input_tokens: 272000, input: 2.00, cached_input: 0.10, cache_write: 2.50, output: 7.50}}
    gpt-6-luna:
      {input: 0.10, cached_input: 0.01, cache_write: 0.125, output: 0.50,
       long_context: {above_input_tokens: 272000, input: 0.20, cached_input: 0.02, cache_write: 0.25, output: 0.75}}
    gpt-5.5:
      {input: 5.00, cached_input: 0.50, output: 30.00,
       long_context: {above_input_tokens: 272000, input: 10.00, cached_input: 1.00, output: 45.00}}
python_executable: null               # the Python that serves the tools; null: the one running the loop
api_retries: {tries: 12, first_wait_s: 60, max_wait_s: 1800}
max_consecutive_refusals: 2

# the rounds
prompt_template: round_v1
rounds_max: 5
patience: 2                           # stop after this many rounds in a row that did not raise the best reward

# one session (one round)
session:
  python_calls: 40
  submissions: 4
  max_turns: 150
  seconds: 5400                       # wall clock; when it runs out, what the session submitted stands

# one run_python call
python:
  time_limit_s: 300
  memory_limit_mb: 4096
  max_result_mb: 8
  threads: 2

# where the agent's code runs (arcagent/sandbox.py): auto, hardened, container, landlock or process
sandbox: auto
sandbox_image: arc-agent-sandbox:1
sandbox_dir: null

# the verifier (arcagent/verifier.py)
verifier:
  runs: 4096                          # an estimator is run this many times per scoring, each with fresh draws
  reference_inputs: 2097152           # the network's accuracy A is measured on this many inputs of the verifier's own
  reference_seed: 20261124            # ... drawn with this seed
  reference_chunk: 32768              # ... this many at a time
  time_limit_s: 600                   # for all the runs of one scoring together
  # Scoring on copies of the network (arcagent/measure.py; docs/REWARD.md): what stops a number that was measured on
  # the network and written into an estimator. Every scoring makes its own copies, each with a few weights
  # changed at random, and a run's error is its estimate less the accuracy of the copy it ran on.
  copies:
    count: 128                        # copies per scoring; 0: score on the network itself, as before
    runs: 32                          # runs of the estimator on each copy (count x runs = 4,096 runs)
    reference_inputs: 65536           # each copy's accuracy is measured on this many inputs (all, where there are no more)
    share: null                       # the probability that a weight is changed ...
    size: null                        # ... by a normal draw of this many times its matrix's root mean square.
                                      # Both are a network's own: its pilot config sets them (python -m arcagent.calibrate)

# what an estimator may hold
entry:
  max_nodes: 400
  max_const_scalars: 256              # numbers written into the estimator

# the reward (arcagent/rewards.py); the parts are kept, so a run can be scored again under another one.
# A config that names another reward replaces this block whole; one that keeps the name changes parameters.
reward:
  name: r_lambda
  lam: 1.0e-6                         # the price of one forward pass: an error of one point (1e-4) = 100 forward passes

# after the rounds: the locked estimator, unchanged, on these networks of the same model (a run config names them).
# The agent never sees them or their scores, and they choose nothing.
heldout:
  networks: []
  every_submission: true              # also score every submission there after each round, for the record
  runs: 256                           # runs per scoring of every submission there (one fixed seed per network)
  check_runs: 4096                    # runs of the locked estimator there

# the report
report:
  sampling_sizes: [16, 64, 256]       # plain sampling at these numbers of inputs, besides the best one under lambda

# strings nothing the agent can reach may contain, besides the model's own list (withheld/<model>/task.yaml)
hygiene: ["Compact-Proof", "Mech-Interp-Agent"]
