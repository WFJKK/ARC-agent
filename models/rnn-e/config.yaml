# The model rnn-e: a recurrent network of 4 units on three real numbers.
# Sizes, the data set, the task and the networks; change values here, never in code.
# Where the networks come from, which is which and how often each gives the task's answer are not in this
# folder: they are in withheld/rnn-e/, which no tool of the agent reaches.
name: rnn-e
sizes:
  n_ctx: 3
  d_hidden: 4
input_space: [real, real, real]
n_outputs: 3
data_set:
  kind: normal
  says: >
    An input is three real numbers, x_0, x_1 and x_2, each drawn on its own from the standard normal
    distribution (mean 0, standard deviation 1). The data set is every input that can be drawn this way, each
    weighted by how likely it is to be drawn.
task:
  says: >
    The task's answer for an input is the position of its second-largest number: the i for which exactly one of
    the three numbers is larger than x_i.
weights:                # as stored in the zoo and as the agent sees them: name and shape
  input: [4, 1]
  recurrent: [4, 4]
  readout: [3, 4]
# rnn-e-s0 is the run's network in config/pilot/rnn-e.yaml; the others are its held-out networks.
networks:
  - id: rnn-e-s0
    weights: zoo/rnn-e-s0.npz
    sha256: 70485b3f6d7b8432ccf5635cc6b7d366b38e284b3a7eecd644006c68bd797fb7
  - id: rnn-e-s4
    weights: zoo/rnn-e-s4.npz
    sha256: 5f58870ede5baa321563fca99f35b75de1ca267b77d834d269d286fa7c579a41
  - id: rnn-e-s1
    weights: zoo/rnn-e-s1.npz
    sha256: d46ae612014dc9ac9544808c5dc4f21daa5ae0b14273ad97661b1c4f4e3f249b
  - id: rnn-e-s2
    weights: zoo/rnn-e-s2.npz
    sha256: 7b38c360fd20549ad35d416f756ceb3bf0285a6f06a8f004b37f0228d17484a9
  - id: rnn-e-s3
    weights: zoo/rnn-e-s3.npz
