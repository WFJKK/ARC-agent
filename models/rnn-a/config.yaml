# The model rnn-a: a recurrent network of 2 units on two real numbers.
# Sizes, the data set, the task and the networks; change values here, never in code.
# Where the networks come from, which is which and how often each gives the task's answer are not in this
# folder: they are in withheld/rnn-a/, which no tool of the agent reaches.
name: rnn-a
sizes:
  n_ctx: 2
  d_hidden: 2
input_space: [real, real]
n_outputs: 2
data_set:
  kind: normal
  says: >
    An input is two real numbers, x_0 and x_1, each drawn on its own from the standard normal distribution (mean
    0, standard deviation 1). The data set is every input that can be drawn this way, each weighted by how
    likely it is to be drawn.
task:
  says: >
    The task's answer for an input is the position of its second-largest number: the i for which exactly one of
    the two numbers is larger than x_i, which with two numbers is the position of the smaller one.
weights:                # as stored in the zoo and as the agent sees them: name and shape
  input: [2, 1]
  recurrent: [2, 2]
  readout: [2, 2]
# rnn-a-s2 is the run's network in config/pilot/rnn-a.yaml; the others are its held-out networks.
networks:
  - id: rnn-a-s2
    weights: zoo/rnn-a-s2.npz
    sha256: 31ce7c103ac14e5d05fe71c8e7243424686597b569dbe3cd441ff2c839a405ad
  - id: rnn-a-s0
    weights: zoo/rnn-a-s0.npz
    sha256: b3a8646ba7024d0d7868a1933097042f61ad3da8865054ee50b9992eecd15d15
  - id: rnn-a-s1
    weights: zoo/rnn-a-s1.npz
    sha256: 069631a74e43ed5cc03f520249bdfcc04325f28d90a9e046c54b02a50901989c
  - id: rnn-a-s3
    weights: zoo/rnn-a-s3.npz
    sha256: dbe34a792e869e2bb812e271573f71a7e80791deca5188be6ea1c7c06e7aee4f
  - id: rnn-a-s4
