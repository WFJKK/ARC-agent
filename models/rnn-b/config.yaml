# The model rnn-b: a recurrent network with one layer of 4 units, a ReLU and no biases, reading three real
# numbers; 32 weights. A small model for smoke runs and tests: a forward pass is 78 operations.
# Its networks are published ones (withheld/rnn/convert.py).
# Sizes, the data set, the task and the networks; change values here, never in code.
# Which network is which and how often each gives the task's answer is in withheld/rnn-b/.
name: rnn-b
sizes:
  n_ctx: 3       # numbers per input
  d_hidden: 4    # units of the recurrent layer
input_space: [real, real, real]   # per position: a real number
n_outputs: 3
data_set:
  kind: normal          # every number drawn on its own from the standard normal distribution
  says: >
    An input is three real numbers, x_0, x_1 and x_2, each drawn on its own from the standard normal
    distribution (mean 0, standard deviation 1). The data set is every input that can be drawn this way,
    each weighted by how likely it is to be drawn.
task:
  says: >
    The task's answer for an input is the position of its second-largest number: the i for which exactly one
    of the three numbers is larger than x_i. The network gives the task's answer on most inputs, not on all.
weights:                # as stored in the zoo and as the agent sees them: name and shape
  input: [4, 1]
  recurrent: [4, 4]
  readout: [3, 4]
# Five networks of the same design and sizes, trained by one recipe with five seeds.
networks:
  - id: rnn-b-s0
    weights: zoo/rnn-b-s0.npz
    sha256: eb4a7bd3f58321f62d926d44e9e86b020afc5d1399b0f621d32ab2eae92f60a4
  - id: rnn-b-s1
    weights: zoo/rnn-b-s1.npz
    sha256: 6a1ce6b15464c4fdb9dfcf9760359f0cd9c8639d61d6e909dc16d8aee23e7c0c
  - id: rnn-b-s2
