# The model lin-e: a linear network on one to four tokens.
# Sizes, the data set, the task and the networks; change values here, never in code.
# Where the networks come from, which is which and how often each gives the task's answer are not in this
# folder: they are in withheld/lin-e/, which no tool of the agent reaches.
name: lin-e
sizes:
  n_ctx: 4
  d_vocab: 64
  d_model: 8
input_space: [65, 65, 65, 65]
n_outputs: 64
data_set:
  kind: lengths
  lengths: [1, 2, 3, 4]
  vocab: 64
  empty: 64
  says: >
    An input is drawn like this. First a number of tokens is picked from 1, 2, 3 and 4, each equally likely.
    Then that many tokens are picked, each a whole number from 0 to 63 and equally likely. The tokens fill the
    first slots and the remaining slots are empty (64). The data set is every input that can be drawn this way,
    each counted as often as it is drawn: about 17 million different inputs, far more with four tokens than with
    one, yet every number of tokens makes up a quarter of the data set.
task:
  says: >
    The task's answer for an input is the smallest of its tokens. An empty slot is not a token.
weights:                # as stored in the zoo and as the agent sees them: name and shape
  embed: [8, 65]
  hidden: [8, 8]
  unembed: [64, 8]
# lin-e-s0 is the run's network in config/pilot/lin-e.yaml; the others are its held-out networks.
networks:
  - id: lin-e-s0
    weights: zoo/lin-e-s0.npz
