# The model rnn-g: a recurrent network with one layer of 16 units, a ReLU and no biases, reading ten real
# numbers; 432 weights.
# Sizes, the data set, the task and the networks; change values here, never in code.
# Where the networks come from, which is which and how often each gives the task's answer are not in this
# folder: they are in withheld/rnn-g/, which no tool of the agent reaches. The agent is given model.py, task.py and the sentences
# under `says`, and the weights of the network of its run.
name: rnn-g
sizes:
  n_ctx: 10      # numbers per input
  d_hidden: 16   # units of the recurrent layer
input_space: [real, real, real, real, real, real, real, real, real, real]   # per position: a real number
n_outputs: 10
data_set:
  kind: normal          # every number drawn on its own from the standard normal distribution
  says: >
    An input is ten real numbers, x_0 to x_9, each drawn on its own from the standard normal distribution
    (mean 0, standard deviation 1). The data set is every input that can be drawn this way, each weighted by
    how likely it is to be drawn.
task:
  says: >
    The task's answer for an input is the position of its second-largest number: the i for which exactly one
    of the ten numbers is larger than x_i.
weights:                # as stored in the zoo and as the agent sees them: name and shape
  input: [16, 1]
  recurrent: [16, 16]
  readout: [10, 16]
# s0 is the run's network; the others, of the same design and sizes, are the held-out networks of the report.
networks:
  - id: rnn-g-s0
    weights: zoo/rnn-g-s0.npz
    sha256: 93ec78ef68b5ca1af97fcea09195e672011d451502db6f18456d6812f4a1bc8c
