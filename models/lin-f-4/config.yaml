# The model lin-f-4: a linear network on four tokens.
# Sizes, the data set, the task and the networks; change values here, never in code.
# Where the networks come from, which is which and how often each gives the task's answer are not in this
# folder: they are in withheld/lin-f-4/, which no tool of the agent reaches.
name: lin-f-4
sizes:
  n_ctx: 4
  d_vocab: 64
  d_model: 8
input_space: [65, 65, 65, 65]
n_outputs: 64
data_set:
  kind: lengths
  lengths: [4]
  vocab: 64
  empty: 64
  says: >
    An input is drawn like this. Four tokens are picked, each a whole number from 0 to 63 and equally likely,
    and they fill the four slots, so no slot is empty. The data set is every input that can be drawn this way,
    each as likely as any other: 64^4 = 16,777,216 different inputs.
task:
  says: >
    The task's answer for an input is the largest of its tokens. An empty slot is not a token.
weights:                # as stored in the zoo and as the agent sees them: name and shape
  embed: [8, 65]
  hidden: [8, 8]
  unembed: [64, 8]
